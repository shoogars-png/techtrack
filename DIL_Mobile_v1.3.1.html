<style>
:root{--bg:#eef2f7;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--pri:#1e3a8a;--acc:#2563eb;--ok:#047857;
  --bl:#2563eb;--bl-bg:#dbeafe;--ro:#be185d;--ro-bg:#fce7f3;--te:#0f766e;--te-bg:#ccfbf1;--vi:#6d28d9;--vi-bg:#ede9fe}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hdr{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.hdr .logo{width:36px;height:36px;border-radius:9px;flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.hdr h1{font-size:1.05rem;margin:0;flex:1;line-height:1.2}
.hdr h1 small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
.hdr .v{font-size:.68rem;background:rgba(255,255,255,.18);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.ib{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:1.15rem;cursor:pointer}
.ib:active{background:rgba(255,255,255,.3)}
.wrap{padding:12px 12px 110px;max-width:760px;margin:0 auto}
.tools{display:grid;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip b{font-weight:700;margin-left:4px;opacity:.75}
.chip.on.bl{background:var(--bl-bg);border-color:var(--bl);color:var(--bl)}
.chip.on.ro{background:var(--ro-bg);border-color:var(--ro);color:var(--ro)}
.chip.on.te{background:var(--te-bg);border-color:var(--te);color:var(--te)}
.chip.on.vi{background:var(--vi-bg);border-color:var(--vi);color:var(--vi)}
.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:16px}
.inp:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 2px 8px}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;font-size:.8rem;padding:4px 0;cursor:pointer}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);margin-bottom:10px;border-left:4px solid var(--c,#94a3b8);overflow:hidden}
.card.sel{outline:2.5px solid var(--acc)}
.ch{display:flex;gap:10px;padding:12px 12px 10px;align-items:flex-start;cursor:pointer}
.ck{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--acc)}
.cm{flex:1;min-width:0}
.ref{font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.98rem}
.bdg{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.kv{font-size:.83rem;margin-top:4px;color:#334155;display:grid;grid-template-columns:auto 1fr;gap:1px 8px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){word-break:break-word}
.nr{color:var(--muted);font-style:italic}
.cnt{font-size:.76rem;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.occ{border-top:1px solid var(--line);background:#f8fafc;padding:6px 12px 10px;display:none}
.card.open .occ{display:block}
.oc{padding:8px 0;border-bottom:1px dashed var(--line)}
.oc:last-of-type{border-bottom:0}
.oh{font-size:.76rem;color:var(--muted);margin-bottom:3px}
.oh b{color:#334155}
.ot{font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.cacts{display:flex;gap:8px;margin-top:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e2e8f0;color:#0f172a}
.btn.p{background:var(--acc);color:#fff}
.btn.s{padding:7px 11px;font-size:.84rem}
.btn:disabled{opacity:.5}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;box-shadow:0 -4px 14px rgba(15,23,42,.08);transform:translateY(110%);transition:transform .2s}
.bar.on{transform:none}
.bar .n{flex:1;font-weight:700;font-size:.9rem}
.ov{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font-size:1.05rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.lbl{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.03em}
.cl{border:1.5px solid var(--line);border-radius:10px;max-height:34vh;overflow:auto}
.cl label{display:flex;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);font-size:.88rem;cursor:pointer}
.cl label:last-child{border-bottom:0}
.cl small{display:block;color:var(--muted);font-size:.76rem;word-break:break-all}
.cl .grp{background:#f1f5f9;font-size:.72rem;font-weight:700;color:var(--muted);padding:5px 11px;text-transform:uppercase}
.pv{white-space:pre-wrap;font-size:.8rem;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:26vh;overflow:auto}
.warn{font-size:.78rem;color:#b45309;margin-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:.86rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.toast.err{background:#b91c1c}
.load{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;font-weight:700;color:var(--pri)}
.load.on{display:flex}
</style>
</head>

<script>
'use strict';
const VERSION = '1.3.1';
const ETATS = [['encours','En cours','bl'],['demandereouverture','Demande réouverture','ro'],['prisencompte','Pris en compte','te'],['programme','Programmé','vi']];
const LS = { cfg:'dilm_cfg', data:'dilm_data' };
const MAILTO_MAX = 1800;   // au-delà, certaines messageries tronquent un lien mailto

let CFG = { url:'', cle:'', sig:'' }, DATA = { at:'', demandes:[], contacts:[] };
const F = { st:new Set(), q:'', site:'', aff:'' };
const SEL = new Set(), OPEN = new Set();
let MAILREFS = [];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nk = s => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function etat(st) { const n = nk(st); return ETATS.find(e => n.startsWith(e[0])) || null; }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function toast(t, err) { const e = $('toast'); e.textContent = t; e.classList.toggle('err', !!err); e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3200); }
function fermer(id) { $(id).classList.remove('on'); }
function fmtAt(iso) { const d = new Date(iso); if (isNaN(d)) return iso || ''; const p = n => String(n).padStart(2,'0'); return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' à '+p(d.getHours())+'h'+p(d.getMinutes()); }
/* occurrences : toujours sans les occurrences non commentées */
function occs(d) { return (Array.isArray(d.occ) ? d.occ : []).filter(o => Array.isArray(o) && String(o[3] || '').trim() !== ''); }

/* ── Lecture du Sheet (JSONP, 3 tentatives) ── */
function jsonp(url, timeout) {
  return new Promise((ok, ko) => {
    const cb = 'dilm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), sc = document.createElement('script');
    const fin = () => { clearTimeout(t); delete window[cb]; sc.remove(); };
    const t = setTimeout(() => { fin(); ko(new Error('délai dépassé')); }, timeout);
    window[cb] = d => { fin(); ok(d); };
    sc.onerror = () => { fin(); ko(new Error('Sheet inaccessible')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'cle=' + encodeURIComponent(CFG.cle) + '&callback=' + cb + '&_t=' + Date.now();
    document.body.appendChild(sc);
  });
}
async function synchroniser() {
  if (!CFG.url || !CFG.cle) { toast('Renseignez l\'URL et la clé dans les réglages.', true); ouvrirReglages(); return; }
  $('load').classList.add('on');
  try {
    let d, err;
    for (let i = 1; i <= 3 && !d; i++) { try { d = await jsonp(CFG.url, i === 1 ? 10000 : 15000); } catch (e) { err = e; if (i < 3) await new Promise(r => setTimeout(r, i * 1000)); } }
    if (!d) throw err;
    if (d.error) throw new Error(d.error);
    if (!Array.isArray(d.demandes)) throw new Error('réponse inattendue');
    DATA = { at: d.at || '', demandes: d.demandes, contacts: Array.isArray(d.contacts) ? d.contacts : [] };
    const refs = new Set(DATA.demandes.map(x => x.ref)); [...SEL].forEach(r => { if (!refs.has(r)) SEL.delete(r); });
    if (!lsSet(LS.data, DATA)) toast('Données affichées, mais non conservées sur le téléphone (stockage plein).', true);
    else toast('✅ ' + DATA.demandes.length + ' demande(s) synchronisée(s)');
    rendre();
  } catch (e) {
    toast('❌ Synchronisation impossible : ' + (e.message || e) + (DATA.demandes.length ? ' — affichage de la dernière copie.' : ''), true);
  } finally { $('load').classList.remove('on'); }
}

/* ── Filtres et liste ── */
function visibles() {
  const q = nk(F.q);
  return DATA.demandes.filter(d => {
    const e = etat(d.statut); if (!e) return false;
    if (F.st.size && !F.st.has(e[0])) return false;
    if (F.site && (d.site || '__na') !== F.site) return false;
    if (F.aff && (F.aff === '__na' ? !!d.aff : d.aff !== F.aff)) return false;
    if (q) { const t = nk([d.ref, d.statut, d.srvDem, d.demandeur, d.site, d.aff].join(' ') + ' ' + occs(d).map(o => o.join(' ')).join(' ')); if (!t.includes(q)) return false; }
    return true;
  });
}
function options(sel, vals, tous, na) {
  const cur = sel.value;
  sel.innerHTML = '<option value="">' + tous + '</option>' + (na ? '<option value="__na">' + na + '</option>' : '') + vals.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : '';
}
function rendre() {
  const all = DATA.demandes.filter(d => etat(d.statut));
  $('h-sub').textContent = DATA.at ? 'Publié le ' + fmtAt(DATA.at) : 'Aucune donnée — synchronisez';
  $('f-st').innerHTML = ETATS.map(([c, l, k]) => '<button class="chip ' + k + (F.st.has(c) ? ' on' : '') + '" data-st="' + c + '" aria-pressed="' + F.st.has(c) + '">' + l + '<b>' + all.filter(d => etat(d.statut)[0] === c).length + '</b></button>').join('');
  const coll = new Intl.Collator('fr');
  options($('f-site'), [...new Set(all.map(d => d.site).filter(Boolean))].sort(coll.compare), 'Tous les sites', 'Site non déterminé');
  options($('f-aff'), [...new Set(all.map(d => d.aff).filter(Boolean))].sort(coll.compare), 'Toutes les affectations', 'Non affectée');
  $('f-site').value = F.site; $('f-aff').value = F.aff;
  const L = visibles();
  $('i-n').textContent = L.length + ' demande' + (L.length > 1 ? 's' : '') + (L.length !== all.length ? ' sur ' + all.length : '');
  const nr = '<span class="nr">Non renseigné</span>';
  $('liste').innerHTML = L.length ? L.map(d => {
    const e = etat(d.statut), O = occs(d), s = SEL.has(d.ref), o = OPEN.has(d.ref);
    return '<article class="card' + (s ? ' sel' : '') + (o ? ' open' : '') + '" style="--c:var(--' + e[2] + ')" data-ref="' + esc(d.ref) + '">'
      + '<div class="ch" data-tog="1"><input type="checkbox" class="ck" data-ck="' + esc(d.ref) + '"' + (s ? ' checked' : '') + ' aria-label="Sélectionner ' + esc(d.ref) + '">'
      + '<div class="cm"><div><span class="ref">' + esc(d.ref) + '</span><span class="bdg" style="background:var(--' + e[2] + '-bg);color:var(--' + e[2] + ')">' + esc(d.statut) + '</span></div>'
      + '<div class="kv"><span>Service</span><span>' + (d.srvDem ? esc(d.srvDem) : nr) + '</span>'
      + '<span>Demandeur</span><span>' + (d.demandeur ? esc(d.demandeur) : nr) + '</span>'
      + '<span>Site</span><span>' + (d.site ? esc(d.site) : nr) + '</span>'
      + '<span>Affectation</span><span>' + (d.aff ? esc(d.aff) + (d.affType ? ' <span class="nr">(' + esc(d.affType) + ')</span>' : '') : '<span class="nr">Non affectée</span>') + '</span>'
      + (d.dateDem ? '<span>Demandée le</span><span>' + esc(d.dateDem) + '</span>' : '') + '</div>'
      + '<div class="cnt"><span>' + O.length + ' commentaire' + (O.length > 1 ? 's' : '') + '</span><span>' + (o ? '▲ Masquer' : '▼ Voir les commentaires') + '</span></div></div></div>'
      + '<div class="occ">' + (O.length ? O.map(x => '<div class="oc"><div class="oh"><b>' + esc(x[0]) + '</b>' + (x[1] ? ' · ' + esc(x[1]) : '') + (x[2] ? ' · ' + esc(x[2]) : '') + '</div><div class="ot">' + esc(x[3]) + '</div></div>').join('') : '<div class="oc nr">Aucune occurrence commentée.</div>')
      + '<div class="cacts"><button class="btn s p" data-mail1="' + esc(d.ref) + '">✉️ Envoyer cette demande</button></div></div></article>';
  }).join('') : '<div class="empty">' + (DATA.demandes.length ? 'Aucune demande ne correspond aux filtres.' : 'Aucune donnée.<br>Touchez ⟳ pour synchroniser, ou ⚙ pour les réglages.') + '</div>';
  barre();
}
function barre() { $('bar').classList.toggle('on', SEL.size > 0); $('bar-n').textContent = SEL.size + ' sélectionnée' + (SEL.size > 1 ? 's' : ''); }
function toutSel(on) { if (on) visibles().forEach(d => SEL.add(d.ref)); else SEL.clear(); rendre(); }

/* ── E-mail ── */
function texteDemande(d) {
  // v1.2.0 : une ligne vide entre chaque information ; Affectation juste après la référence
  const B = ['RÉFÉRENCE ' + d.ref + ' — ' + (d.statut || ''),
    'Affectation : ' + (d.aff ? d.aff + (d.affType ? ' (' + d.affType + ')' : '') : 'Non affectée'),
    'Service demandeur : ' + (d.srvDem || 'Non renseigné'),
    'Nom demandeur : ' + (d.demandeur || 'Non renseigné'),
    'Site : ' + (d.site || 'Non renseigné')];
  if (d.dateDem) B.push('Demandée le : ' + d.dateDem);
  const O = occs(d);
  B.push('Commentaires (' + O.length + ') :');
  O.forEach(o => B.push('  • ' + o[0] + (o[1] ? ' — ' + o[1] : '') + (o[2] ? ' (' + o[2] + ')' : '') + ' :\n'
    + String(o[3]).replace(/\r\n?/g, '\n').split('\n').map(x => x.trim()).filter(Boolean).map(x => '    ' + x).join('\n')));
  return B.join('\n\n');
}
function corps() {
  const D = MAILREFS.map(r => DATA.demandes.find(d => d.ref === r)).filter(Boolean);
  return 'Bonjour,\n\n' + (D.length > 1 ? 'Veuillez trouver ci-dessous le suivi de ' + D.length + ' demandes DIL.' : 'Veuillez trouver ci-dessous le suivi de la demande DIL.') + '\n\n'
    + D.map(texteDemande).join('\n\n' + '─'.repeat(24) + '\n\n') + '\n\nCordialement,' + (CFG.sig ? '\n' + CFG.sig : '');
}
function destinataires() {
  const s = [...document.querySelectorAll('#m-ct input:checked')].map(i => i.value);
  const libres = $('m-libre').value.split(/[;,\s]+/).map(x => x.trim()).filter(Boolean);
  return [...new Set([...s, ...libres])];
}
function ouvrirMail(ref) {
  MAILREFS = ref ? [ref] : [...SEL];
  if (!MAILREFS.length) { toast('Veuillez sélectionner au moins une demande.', true); return; }
  $('m-titre').textContent = 'Envoyer ' + MAILREFS.length + ' demande' + (MAILREFS.length > 1 ? 's' : '');
  const grp = t => DATA.contacts.filter(c => c.type === t);
  const lst = (t, lib) => grp(t).length ? '<div class="grp">' + lib + '</div>' + grp(t).map(c => '<label><input type="checkbox" class="ck" value="' + esc(c.email) + '"><span>' + esc(c.nom) + '<small>' + esc(c.email) + '</small></span></label>').join('') : '';
  $('m-ct').innerHTML = (lst('Interlocuteur', 'Interlocuteurs') + lst('Carnet', 'Carnet d\'adresses')) || '<div class="grp" style="text-transform:none">Aucun contact publié — saisissez une adresse ci-dessous.</div>';
  $('m-libre').value = '';
  $('m-obj').value = MAILREFS.length === 1 ? 'Demande DIL ' + MAILREFS[0] : 'Suivi de ' + MAILREFS.length + ' demandes DIL';
  majApercu();
  $('m-share').style.display = navigator.share ? '' : 'none';
  $('ov-mail').classList.add('on');
}
function majApercu() {
  const b = corps(); $('m-pv').textContent = b;
  $('m-warn').textContent = b.length > MAILTO_MAX ? '⚠️ Message long (' + b.length + ' caractères) : certaines messageries le coupent. Utilisez « Partager… » ou « Copier le texte » si le message est incomplet.' : '';
}
function envoyerMail() {
  const to = destinataires();
  if (!to.length) { toast('Choisissez ou saisissez au moins un destinataire.', true); return; }
  const bad = to.filter(a => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a));
  if (bad.length) { toast('Adresse invalide : ' + bad.join(', '), true); return; }
  const href = 'mailto:' + to.map(encodeURIComponent).join(',') + '?subject=' + encodeURIComponent($('m-obj').value) + '&body=' + encodeURIComponent(corps());
  // v1.1.0 : lien cliqué en « _top » — fonctionne aussi quand l'appli est servie par l'Apps Script (iPhone)
  const a = document.createElement('a'); a.href = href; a.target = SERVI ? '_top' : '_self'; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1000);
}
async function partager() {
  try { await navigator.share({ title: $('m-obj').value, text: corps() }); } catch (e) { if (e && e.name !== 'AbortError') toast('Partage impossible : ' + e.message, true); }
}
async function copierTexte() {
  const t = 'Objet : ' + $('m-obj').value + '\n\n' + corps();
  try { await navigator.clipboard.writeText(t); toast('✅ Texte copié'); }
  catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (x) {} a.remove(); toast(ok ? '✅ Texte copié' : 'Copie impossible sur ce téléphone', !ok); }
}

/* ── Réglages ── */
function ouvrirReglages() { $('s-url').value = CFG.url; $('s-cle').value = CFG.cle; $('s-sig').value = CFG.sig || ''; $('ov-set').classList.add('on'); }
function enregistrerReglages() {
  const u = $('s-url').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { toast('L\'URL doit commencer par https://script.google.com/ et se terminer par /exec', true); return; }
  if (!$('s-cle').value.trim()) { toast('Saisissez la clé d\'accès.', true); return; }
  CFG = { url: u, cle: $('s-cle').value.trim(), sig: $('s-sig').value.trim() };
  if (!lsSet(LS.cfg, CFG)) toast('Réglages non mémorisés sur ce navigateur (navigation privée ?)', true);
  fermer('ov-set'); synchroniser();
}
let effArme = 0;
function effacerDonnees() {
  // v1.1.0 : pas de fenêtre confirm() (bloquée quand l'appli est servie par l'Apps Script) — second toucher pour confirmer
  const b = $('b-eff');
  if (Date.now() - effArme > 4000) { effArme = Date.now(); b.textContent = 'Toucher à nouveau pour confirmer l\'effacement'; setTimeout(() => { if (Date.now() - effArme >= 4000) b.textContent = 'Effacer les données de ce téléphone'; }, 4100); return; }
  effArme = 0; b.textContent = 'Effacer les données de ce téléphone';
  try { localStorage.removeItem(LS.data); } catch (e) {}
  DATA = { at: '', demandes: [], contacts: [] }; SEL.clear(); OPEN.clear(); rendre(); fermer('ov-set'); toast('Données effacées du téléphone');
}

/* ── Événements ── */
$('f-st').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if (!b) return; const c = b.dataset.st; F.st.has(c) ? F.st.delete(c) : F.st.add(c); rendre(); });
let tq; $('f-q').addEventListener('input', e => { clearTimeout(tq); tq = setTimeout(() => { F.q = e.target.value; rendre(); }, 200); });
$('f-site').addEventListener('change', e => { F.site = e.target.value; rendre(); });
$('f-aff').addEventListener('change', e => { F.aff = e.target.value; rendre(); });
$('liste').addEventListener('click', e => {
  const m = e.target.closest('[data-mail1]'); if (m) { ouvrirMail(m.dataset.mail1); return; }
  const ck = e.target.closest('[data-ck]'); if (ck) { ck.checked ? SEL.add(ck.dataset.ck) : SEL.delete(ck.dataset.ck); ck.closest('.card').classList.toggle('sel', ck.checked); barre(); return; }
  const h = e.target.closest('[data-tog]'); if (h) { const r = h.closest('.card').dataset.ref; OPEN.has(r) ? OPEN.delete(r) : OPEN.add(r); h.closest('.card').classList.toggle('open'); h.querySelector('.cnt span:last-child').textContent = OPEN.has(r) ? '▲ Masquer' : '▼ Voir les commentaires'; }
});
['m-libre', 'm-obj'].forEach(i => $(i).addEventListener('input', majApercu));

/* ── Démarrage ── */
CFG = Object.assign({ url: '', cle: '', sig: '' }, lsGet(LS.cfg, {}));
// v1.1.0 : appli servie par l'Apps Script → URL et clé fournies par le serveur
const SERVI = !!(window.DILM_INJECT && window.DILM_INJECT.url);
if (SERVI) { CFG.url = window.DILM_INJECT.url; CFG.cle = window.DILM_INJECT.cle || CFG.cle; lsSet(LS.cfg, CFG); }
DATA = Object.assign({ at: '', demandes: [], contacts: [] }, lsGet(LS.data, {}));
rendre();
if (CFG.url && CFG.cle) synchroniser(); else ouvrirReglages();
</script>
